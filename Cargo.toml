[package]
name = "server-shared"
version = "0.1.0"
edition = "2024"

[dependencies]
capnp = { git = "https://github.com/dankmeme01/capnproto-rust", rev = "2c2bdee", default-features = false, features = [
    "unaligned",
    "std",
    "sync_reader",
] }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
tracing-appender = { version = "0.2.5", features = ["parking_lot"] }
tracing-subscriber = "0.3.23"
toml = "1.1.4"
base64 = "0.23.1"
qunet = { git = "https://github.com/dankmeme01/qunet", rev = "v1.2.1", default-features = false }
thiserror = "2.0.20"
blake3 = "1.8.7"
heapless = { version = "0.9.3", features = ["serde"] }
hex = "0.4.3"
hmac = "0.13.0"
console-subscriber = { version = "0.5.0", features = [
    "parking_lot",
], optional = true }
parking_lot = { version = "0.12.5", features = ["hardware-lock-elision"] }
smallvec = "1.15.2"
validator = { version = "0.21.0", features = ["derive"] }
bitpiece = "2.6.0"
arc-swap = "1.9.2"
serde_bytes = "0.11.19"
rmp-serde = "1.3.1"

[build-dependencies]
capnpc = { git = "https://github.com/dankmeme01/capnproto-rust", rev = "2c2bdee" }

[features]
default = []
main = []
game = []
srvc = []
all = ["main", "game", "srvc", "quic", "websocket"]
quic = ["qunet/quic"]
websocket = ["qunet/websocket"]
qunet-client = ["qunet/client"]
tokio_tracing = ["dep:console-subscriber"]
dyn-encoding = ["capnp/alloc"]
